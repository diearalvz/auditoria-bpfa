<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Auditoría - BPFA</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
* { -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
.modal-overlay { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px); }
.toast-notification { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 24px; border-radius: 50px; z-index: 1000; font-size: 14px; }
</style>
</head>

<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

<!-- Modal de registro -->
<div id="registration-modal" class="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl p-6">
    <h2 class="text-2xl font-bold text-amber-500 mb-4">📋 Auditoría BPFA</h2>
    <label class="block text-sm font-bold text-gray-700 mb-2">👤 Nombre completo del estudiante:</label>
    <input type="text" id="student-name" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500" placeholder="Ej: Juan Pérez">
    <button id="btn-start" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 px-4 rounded-xl mt-6">🚀 Comenzar Auditoría</button>
  </div>
</div>

<header class="bg-slate-800 text-white p-3 md:p-4 shadow-md flex flex-col md:flex-row justify-between items-center gap-2">
  <div>
    <h1 class="text-lg md:text-xl font-bold text-amber-400">PLANTA INTERACTIVA BPFA</h1>
    <p class="text-xs text-gray-300 hidden sm:block">Módulo de Inspección de Instalaciones, Equipos y Materiales</p>
  </div>
  <div class="flex gap-3">
    <div class="bg-slate-700 px-3 py-1 rounded-lg text-center"><span class="text-xs text-gray-300">🎯 Ayudas</span><span id="help-counter" class="text-amber-400 font-bold text-lg block">3</span></div>
    <div class="bg-slate-700 px-3 py-1 rounded-lg"><span class="text-xs">Progreso: <span id="progress-text" class="text-amber-400">Escena 1 de 7</span></span></div>
  </div>
</header>

<main id="main-content" class="hidden flex-1 max-w-7xl mx-auto p-3 md:p-4 grid grid-cols-1 lg:grid-cols-3 gap-4">
  <div class="lg:col-span-2">
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
      <div class="bg-gray-200 px-3 py-2 flex justify-between items-center border-b">
        <span class="font-bold text-sm" id="scene-title">Escena</span>
        <button id="btn-help" class="text-xs bg-amber-500 hover:bg-amber-600 text-white px-3 py-1 rounded">💡 Ayuda</button>
      </div>
      <div class="w-full overflow-x-auto overflow-y-hidden" id="scroll-wrapper">
        <div class="relative w-full cursor-crosshair" id="image-viewport">
          <img id="scene-image" src="" class="w-full h-auto block select-none">
          <div id="pins-overlay" class="absolute inset-0 pointer-events-none"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="flex flex-col gap-4">
    <div class="bg-white p-4 rounded-xl shadow-lg flex-1">
      <h3 class="font-bold border-b pb-2 flex justify-between"><span>🔍 Hallazgos Detectados</span><span id="findings-counter" class="text-xs bg-slate-200 px-2 rounded-full">0 hallazgos</span></h3>
      <div id="questions-container" class="mt-3 space-y-3 max-h-[280px] overflow-y-auto">
        <div id="empty-state" class="text-center py-8 text-gray-400">No has marcado ninguna falla</div>
      </div>
      <div class="flex gap-2 mt-3">
        <button id="btn-prev" class="w-full bg-slate-500 text-white font-bold py-3 rounded-xl hidden">⬅️ Escena Anterior</button>
        <button id="btn-next" class="w-full bg-slate-800 text-white font-bold py-3 rounded-xl">Siguiente Escena ➡️</button>
      </div>
      <button id="btn-finish" class="w-full bg-amber-500 text-slate-900 font-bold py-3 rounded-xl mt-3 hidden">💾 Finalizar Auditoría</button>
    </div>
  </div>
</main>

<script>
// ==================== FIREBASE ====================
const firebaseConfig = {
  apiKey: "AIzaSyD1rYU299raY0U3N_qeovECiYIZl5aNTlM",
  authDomain: "equ-mat-ins.firebaseapp.com",
  projectId: "equ-mat-ins",
  storageBucket: "equ-mat-ins.firebasestorage.app",
  messagingSenderId: "357351478133",
  appId: "1:357351478133:web:bbe8bff7e5e43f66f0f93c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const RESULTS_COLLECTION = "auditoria_resultados";

// ==================== DATASET ====================
const dataset = {
  1: { title: "Escena 1: Muelle de Ingreso", isClean: false, image: "assets/escena1.png", hotspots: [
    { id: "e1_p1", x: 52, y: 85, r: 13, label: "Botas oscuras", q: "¿Por qué las botas deben ser de color claro en áreas de inspección y no oscuras?" }
  ]},
  2: { title: "Escena 2: Pasillos de Almacenamiento A", isClean: false, image: "assets/escena2.png", hotspots: [
    { id: "e2_p1", x: 23, y: 72, r: 13, label: "Piso Húmedo", q: "¿Qué riesgo corren los bultos de alimento al estar sobre un suelo húmedo?" },
    { id: "e2_p2", x: 80, y: 64, r: 13, label: "Estiba Dañada", q: "¿Por qué es peligroso mantener estibas rotas o astilladas?" },
    { id: "e2_p3", x: 30, y: 55, r: 13, label: "Arrume contra pared", q: "¿Por qué está mal acomodar los bultos completamente pegados a las paredes?" }
  ]},
  3: { title: "Escena 3: Estanterías de Almacenamiento Especial", isClean: false, image: "assets/escena3.png", hotspots: [
    { id: "e3_p1", x: 30, y: 18, r: 13, label: "Distribución vertical incorrecta", q: "¿Por qué ubicar sacos medicados sobre alimentos comerciales es un error grave?" },
    { id: "e3_p2", x: 62, y: 32, r: 13, label: "Derrame de polvillo medicado", q: "¿Qué consecuencias trae si el polvo medicado cae en sacos inferiores?" }
  ]},
  4: { title: "Escena 4: Área de Dosificación y Pesaje", isClean: true, image: "assets/escena4.png", hotspots: [] },
  5: { title: "Escena 5: Infraestructura Alta (Techado)", isClean: false, image: "assets/escena5.png", hotspots: [
    { id: "e5_p1", x: 20,  5: { title: "Escena 5: Infraestructura Alta (Techado)", isClean: false, image: "assets/escena5.png", hotspots: [
    { id: "e5_p1", x: 20, y: 15, r: 13, label: "Gotera activa", q: "¿Por qué la humedad compromete la calidad de la planta?" },
    { id: "e5_p2", x: 74, y: 16, r: 13, label: "Luminaria expuesta sin cubierta", q: "¿Qué peligro físico corren los alimentos si las lámparas no tienen cubierta?" },
    { id: "e5_p3", x: 40, y: 50, r: 13, label: "Paredes con manchas de humedad", q: "Las paredes presentan moho y deterioro. ¿Qué acción correctiva se debe realizar para cumplir la normativa?" }
  ]},
  6: { title: "Escena 6: Área de Residuos o Zona de Desechos", isClean: false, image: "assets/escena6.png", hotspots: [
    { id: "e6_p1", x: 45, y: 55, r: 13, label: "Saco roto y derrame", q: "¿Qué problemas de bioseguridad acarrea dejar alimento esparcido en el suelo?" },
    { id: "e6_p2", x: 70, y: 68, r: 13, label: "Herramientas de aseo en el suelo", q: "¿Cuál es el error de dejar escobas y traperos tirados en el piso en lugar de guardarlos?" }
  ]},
  7: { title: "Escena 7: Área de Despacho Perimetral", isClean: false, image: "assets/escena7.png", hotspots: [
    { id: "e7_p1", x: 45, y: 25, r: 13, label: "Portón abierto a maleza", q: "¿Qué norma de instalaciones se incumple al abrir hacia un patio con maleza sin barrera?" },
    { id: "e7_p2", x: 12, y: 68, r: 13, label: "Luz inferior en puerta", q: "¿Por qué es una falla grave de hermeticidad tener un espacio libre en la puerta?" },
    { id: "e7_p3", x: 14, y: 84, r: 13, label: "Estación de cebo destruida", q: "¿Qué medida correctiva se debe registrar ante una trampa de plagas rota?" }
  ]}
};

// ==================== VARIABLES ====================
let currentSceneId = 1;
let availableHelps = 3;
let studentName = "";
const studentAnswers = {};

// ==================== FUNCIONES ====================
function updateHelpCounter() {
  helpCounter.textContent = availableHelps;
  btnHelp.disabled = availableHelps === 0;
  btnHelp.textContent = availableHelps === 0 ? "💔 Sin Ayudas" : "💡 Ayuda";
}

function revealNextMissingHotspot() {
  if (availableHelps <= 0) { alert("❌ No quedan ayudas"); return; }
  const scene = dataset[currentSceneId];
  const currentFindings = studentAnswers[currentSceneId]?.findings || {};
  const missing = scene.hotspots.filter(s => !currentFindings[s.id]);
  if (missing.length === 0) { alert("🎉 Ya encontraste todas las fallas"); return; }
  const spot = missing[0];
  alert(`💡 Ayuda\n\n📍 ${spot.label}\n\n🔍 Busca en el área indicada.`);
  availableHelps--; // siempre descuenta
  updateHelpCounter();
}

btnHelp.onclick = revealNextMissingHotspot;

function loadScene(id) {
  currentSceneId = id;
  const scene = dataset[id];
  sceneImage.src = scene.image;
  sceneTitle.textContent = scene.title;
  progressText.textContent = `Escena ${id} de 7`;
  pinsOverlay.innerHTML = "";
  questionsContainer.innerHTML = `<div id="empty-state" class="text-center py-8 text-gray-400">No has marcado ninguna falla</div>`;
  findingsCounter.textContent = "0 hallazgos";
  btnPrev.classList.toggle("hidden", id === 1);
  btnNext.classList.toggle("hidden", id === 7);
  btnFinish.classList.toggle("hidden", id !== 7);
  if (!studentAnswers[id]) studentAnswers[id] = { markedConforme: false, findings: {} };
}

btnNext.onclick = () => { if (currentSceneId < 7) loadScene(currentSceneId + 1); };
btnPrev.onclick = () => { if (currentSceneId > 1) loadScene(currentSceneId - 1); };

btnFinish.onclick = async () => {
  await db.collection(RESULTS_COLLECTION).add({
    studentName,
    timestamp: new Date().toISOString(),
    fechaLegible: new Date().toLocaleString(),
    helpsUsed: 3 - availableHelps,
    totalHelps: 3,
    answers: studentAnswers
  });
  alert("✅ Auditoría guardada en la nube");
  // volver al inicio
  studentName = "";
  availableHelps = 3;
  updateHelpCounter();
  currentSceneId = 1;
  loadScene(1);
  document.getElementById("registration-modal").style.display = "flex";
  mainContent.style.display = "none";
};

// ==================== REGISTRO ====================
btnStart.onclick = function() {
  studentName = studentNameInput.value.trim();
  if (studentName === "") {
    alert("⚠️ Por favor, ingresa tu nombre completo para continuar.");
    return;
  }
  registrationModal.style.display = "none";
  mainContent.style.display = "grid";
  loadScene(1);
  updateHelpCounter();
};

// Inicialización
const sceneImage = document.getElementById("scene-image");
const sceneTitle = document.getElementById("scene-title");
const progressText = document.getElementById("progress-text");
const pinsOverlay = document.getElementById("pins-overlay");
const questionsContainer = document.getElementById("questions-container");
const findingsCounter = document.getElementById("findings-counter");
const btnPrev = document.getElementById("btn-prev");
const btnNext = document.getElementById("btn-next");
const btnFinish = document.getElementById("btn-finish");
const btnHelp = document.getElementById("btn-help");
const helpCounter = document.getElementById("help-counter");
const registrationModal = document.getElementById("registration-modal");
const studentNameInput = document.getElementById("student-name");
const btnStart = document.getElementById("btn-start");
const mainContent = document.getElementById("main-content");

</script>
</body>
</html>
